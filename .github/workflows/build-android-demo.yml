name: Android Google Satellite — build demo APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-google-satellite-demo/**'
      - '.github/workflows/build-android-demo.yml'
  push:
    branches: [main]
    paths:
      - 'android-google-satellite-demo/**'
      - '.github/workflows/build-android-demo.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android API 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Probe public NASA SAR WMS sources (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.parse, urllib.request
          base="https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi"
          for layer in ("NISAR_L2_Geocoded_Polarimetric_Covariance",
                        "OPERA_L2_Radiometric_Terrain_Corrected_SAR_Sentinel-1"):
              params=dict(SERVICE="WMS",VERSION="1.1.1",REQUEST="GetMap",LAYERS=layer,
                          STYLES="",SRS="EPSG:4326",FORMAT="image/png",TRANSPARENT="TRUE",
                          WIDTH=128,HEIGHT=128,BBOX="-151.7,61.0,-151.5,61.2",TIME="2026-10-01")
              url=base+"?"+urllib.parse.urlencode(params)
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"KODI-SAR-test/0.4"})
                  with urllib.request.urlopen(req,timeout=20) as reply:
                      head=reply.read(1200)
                      if not head.startswith(b"\x89PNG\r\n\x1a\n"):
                          raise RuntimeError("No PNG signature: "+repr(head))
                      print("NASA GIBS responds with PNG for",layer)
              except Exception as exc:
                  print("WARNING: NASA WMS imagery not verified:",layer,str(exc)[:1100])
          PY
      - name: Verify public NASA CMR NISAR catalog API (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          source="https://cmr.earthdata.nasa.gov/search/granules.json"
          for name in ("NISAR_L2_GCOV_V1", "NISAR_L2_GCOV_PROVISIONAL_V1",
                       "NISAR_L2_GCOV_BETA_V1"):
              params={"provider":"ASF", "short_name":name, "sort_key":"-start_date",
                      "page_size":"2", "bounding_box":"-150.0,60.9,-149.6,61.3"}
              try:
                  url=source+"?"+urllib.parse.urlencode(params)
                  request=urllib.request.Request(url,
                      headers={"Accept":"application/json","User-Agent":"KODI-CMR-test/0.5"})
                  with urllib.request.urlopen(request,timeout=18) as response:
                      data=json.load(response)
                  entries=data.get("feed",{}).get("entry",[])
                  print("CMR OK",name,"entries",len(entries),
                        "latest",entries[0].get("time_start","none") if entries else "none")
              except Exception as ex:
                  print("CMR FAILED",name,str(ex)[:350])
          PY
      - name: Configure local Maps key without publishing it
        env:
          MAPS_API_KEY: ${{ secrets.KODI_GOOGLE_MAPS_KEY }}
        run: |
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > android-google-satellite-demo/local.properties
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::warning::No KODI_GOOGLE_MAPS_KEY secret: APK compiles but Google tiles will not load."
          fi
      - name: Restore stable debug keystore from a PRIVATE secret (optional)
        env:
          STABLE_KEYSTORE_B64: ${{ secrets.KODI_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$STABLE_KEYSTORE_B64" ]; then
            printf '%s' "$STABLE_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "Stable PRIVATE signing key loaded; API key may be restricted to its SHA-1."
          else
            echo "::warning::No KODI_DEBUG_KEYSTORE_B64. New debug builds may have differing SHA-1 fingerprints."
          fi
      - name: Build debug APK (prototype, not V6.2 upgrade)
        run: gradle --no-daemon -p android-google-satellite-demo :app:assembleDebug
      - name: Show prototype debug signing SHA-1
        shell: bash
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep SHA1 || true
          echo "A debug build has a DIFFERENT package name and signing SHA1 from installed KODI V6.2."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kodi-google-satellite-demo-debug-apk
          path: android-google-satellite-demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
