plugins {
    id 'com.android.application'
}
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
android {
    namespace 'com.kodi.fusion.mapsdemo'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kodi.fusion.mapsdemo.repair20261117'
        minSdk 23
        targetSdk 34
        versionCode 8
        versionName '0.8-osm-map-install-repair'
        manifestPlaceholders = [MAPS_API_KEY: (localProps.getProperty('MAPS_API_KEY') ?: '')]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
