plugins {
    id 'com.android.application'
}
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
android {
    namespace 'com.kodi.fusion.mapsdemo'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kodi.fusion.mapsdemo'
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName '0.4.1-google-sar-keytest'
        manifestPlaceholders = [MAPS_API_KEY: (localProps.getProperty('MAPS_API_KEY') ?: '')]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
}
